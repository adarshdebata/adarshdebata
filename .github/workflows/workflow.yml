# Fills the "Writing" section of README.md (between the BLOG-POST-LIST markers)
# with the latest articles from the Dev Ledger RSS feed.
name: Latest blog post workflow

on:
  schedule:
    - cron: "0 0 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-with-blog:
    name: Update this repo's README with latest blog posts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://adarshdebata.github.io/dev-ledger/rss.xml"
          max_post_count: 5
          commit_message: "Update Writing section with the latest Dev Ledger posts"
